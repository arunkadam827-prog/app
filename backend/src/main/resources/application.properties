spring.application.name=farmer
server.port=${PORT:8080}
server.address=0.0.0.0

# Database — on Render these come from DATABASE_URL (converted by entrypoint.sh).
# Locally they fall back to the Postgres instance on this PC.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farmerdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:newpass123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

server.error.include-message=always

# Google Sign-In: OAuth Web Client ID used to validate incoming ID tokens.
# Leave blank to skip the audience check (development only).
google.client-id=${GOOGLE_CLIENT_ID:}

# ═══════════════════════════════════════════════════════════════════
#  Kisan AI — customer-support / chatbot engine
# ═══════════════════════════════════════════════════════════════════
# Master switch. When true AND ai.api-key is set, real LLM answers are used;
# otherwise the built-in offline knowledge base answers (app still works).
ai.enabled=${AI_ENABLED:true}

# Provider family: "openai" (any OpenAI-compatible endpoint) or "gemini".
ai.provider=${AI_PROVIDER:openai}

# API key. Leave blank to run fully offline with the knowledge-base fallback.
ai.api-key=${AI_API_KEY:sk-scdpe2vFyhWRwhpvowBdLVBZW2evFwMUD7WG48FN1ff5mTOX}

# Model name for the chosen provider.
#   OpenAI-compatible examples: gpt-4o-mini, llama-3.1-8b-instant (Groq),
#   mistral-small, or a local model served by Ollama/LM Studio.
#   Gemini example: gemini-1.5-flash
ai.model=${AI_MODEL:deepseek-v4-flash}

# Base URL (for the OpenAI-compatible provider only). Point this at Groq,
# OpenRouter, Together, or a local server to avoid depending on OpenAI.
#   OpenAI   : https://api.openai.com/v1
#   Groq     : https://api.groq.com/openai/v1
#   Ollama   : http://localhost:11434/v1
ai.base-url=${AI_BASE_URL:https://agentrouter.org/v1}
# Upstream request timeout and how many products to inject as context.
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:25}
ai.max-context-products=${AI_MAX_CONTEXT_PRODUCTS:8}
